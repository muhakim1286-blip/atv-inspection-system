services:
  - type: web
    name: atv-inspection-api
    runtime: python
    plan: free              # no disk needed anymore - Supabase holds all persistent data
    buildCommand: pip install -r requirements.txt
    startCommand: python backend_main.py
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false          # Supabase > Project Settings > Database > Connection string (URI)
      - key: SUPABASE_URL
        sync: false          # Supabase > Project Settings > API > Project URL
      - key: SUPABASE_SERVICE_KEY
        sync: false          # Supabase > Project Settings > API > service_role secret key
      - key: SUPABASE_BUCKET
        value: "Inspection Photo"
      - key: ALLOWED_ORIGINS
        value: "*"           # tighten to your Vercel URL(s) once deployed, comma-separated

# Admin accounts are created via CLI, not an env var. Since all data lives in Supabase
# (not on Render), you can run this from your own machine (with DATABASE_URL in .env
# pointing at the same Supabase project) - no need for Render shell access:
#   python backend_main.py create-user manager@example.com "a-strong-password"
